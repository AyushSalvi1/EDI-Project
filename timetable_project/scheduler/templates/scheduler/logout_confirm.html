{% extends "scheduler/base.html" %}

{% block title %}Sign Out | Automatic Timetable Generator{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
  <div class="card p-8 max-w-md text-center bg-[#1E293B]/90 backdrop-blur-xl border border-slate-800 rounded-xl shadow-2xl">
    <div class="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center mx-auto mb-4 text-cyan-400 text-lg shadow-sm">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
    </div>
    <span class="status-pill-indigo mb-2 !text-[10px]">Session Termination</span>
    <h1 class="text-xl font-extrabold text-[#F8FAFC] tracking-tight mt-1">Sign Out of Session?</h1>
    <p class="text-xs text-slate-400 mt-2">
      You are currently authenticated as <span class="font-bold text-cyan-400 font-mono">{{ request.user.username }}</span>.
    </p>

    <form method="POST" class="mt-6 flex flex-wrap gap-2.5 justify-center">
      {% csrf_token %}
      <button type="submit" class="btn-primary !text-xs !py-2.5 !px-5 !rounded-xl shadow-glow-indigo-sm font-bold">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
      </button>
      <a href="{% url 'scheduler:my_timetable' %}" class="btn-ghost !text-xs !py-2.5 !px-4 !rounded-xl">Stay Signed In</a>
    </form>
  </div>
</div>
{% endblock %}
