{% extends "scheduler/base.html" %}

{% block title %}Sign Out | Automatic Timetable Generator{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
  <div class="card p-8 max-w-md text-center">
    <div class="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center mx-auto mb-4">
      <i class="fa-solid fa-arrow-right-from-bracket text-slate-500 text-lg"></i>
    </div>
    <h1 class="text-lg font-extrabold text-slate-900">Sign out?</h1>
    <p class="text-xs text-slate-500 mt-2">
      You are currently signed in as <span class="font-semibold text-slate-700">{{ request.user.username }}</span>.
    </p>

    <form method="POST" class="mt-6 flex flex-wrap gap-2 justify-center">
      {% csrf_token %}
      <button type="submit" class="btn-primary">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
      </button>
      <a href="{% url 'scheduler:my_timetable' %}" class="btn-ghost">Stay signed in</a>
    </form>
  </div>
</div>
{% endblock %}
