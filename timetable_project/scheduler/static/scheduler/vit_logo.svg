<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="#1e3a8a" />
  <!-- VIT initials -->
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">VIT</text>
  <!-- Full name -->
  <text x="170" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Vishwakarma Institute</text>
  <text x="170" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">of Technology, Pune</text>
  <!-- Decorative line -->
  <line x1="120" y1="40" x2="220" y2="40" stroke="#1e3a8a" stroke-width="2" />
  <line x1="120" y1="80" x2="220" y2="80" stroke="#1e3a8a" stroke-width="2" />
</svg>